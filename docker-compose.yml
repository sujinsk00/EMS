services:
  mysql:
    image: mysql:8.4
    container_name: ems-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: employee_management
      MYSQL_USER: ems_user
      MYSQL_PASSWORD: ems_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uems_user", "-pems_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
